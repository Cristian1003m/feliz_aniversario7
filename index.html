<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Aniversario</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff5f6; --card:#fffafa; --ink:#4a2a33; --rose:#d94f6e; --wine:#8c2742; --soft:#f3c4cf; --paper:#fffdf8; --shadow:rgba(140,39,66,.18);
  --script:"Great Vibes","Brush Script MT",cursive; --serif:"Cormorant Garamond",Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1d0f15; --card:#2a1620; --ink:#f6dfe5; --rose:#ff7a98; --wine:#ff9fb4; --soft:#5a2a39; --paper:#fff6ee; --shadow:rgba(0,0,0,.5); color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1d0f15; --card:#2a1620; --ink:#f6dfe5; --rose:#ff7a98; --wine:#ff9fb4; --soft:#5a2a39; --paper:#fff6ee; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden;display:grid;place-items:center;
  background-image:radial-gradient(circle at 20% 15%,var(--soft),transparent 45%),radial-gradient(circle at 85% 90%,var(--soft),transparent 40%)}
canvas#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1.5rem;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.scene.on{opacity:1;visibility:visible}
h1{font-family:var(--script);font-weight:400;color:var(--wine);margin:0;line-height:1.1}
.lock h1{font-size:clamp(2.2rem,10vw,3.4rem);max-width:90vw}
.hint{font-style:italic;font-size:1.05rem;opacity:.75;min-height:1.4em;margin:0}

/* Huella */
.fp{position:relative;width:min(52vw,210px);aspect-ratio:1;border:0;border-radius:50%;background:var(--card);box-shadow:0 10px 30px var(--shadow);cursor:pointer;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--rose)}
.fp svg{position:absolute;inset:0;width:100%;height:100%}
.fp .ring{fill:none;stroke:var(--rose);stroke-width:3;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;transform:rotate(-90deg);transform-origin:50% 50%}
.fp .prints{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;opacity:.45;transition:opacity .3s}
.fp.hold .prints{opacity:1}
.fp.hold{animation:pulse 1s ease-in-out infinite}
.fp .scan{position:absolute;left:18%;right:18%;top:20%;height:2px;background:var(--rose);box-shadow:0 0 10px var(--rose);opacity:0}
.fp.hold .scan{opacity:1;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:78%}}
@keyframes pulse{50%{transform:scale(1.04)}}

/* Sobre */
.date{letter-spacing:.22em;font-size:.9rem;color:var(--wine);text-transform:uppercase;opacity:.7;margin:-.4rem 0 0}
.gift h1{font-size:clamp(2.6rem,12vw,4.2rem)}
.env{position:relative;width:min(72vw,300px);aspect-ratio:3/2;border:0;padding:0;background:none;cursor:pointer;margin-top:1.2rem;filter:drop-shadow(0 14px 18px var(--shadow));
  -webkit-tap-highlight-color:transparent;animation:float 3.2s ease-in-out infinite}
.env .back,.env .front,.env .flap{position:absolute;inset:0}
.env .back{background:#f4cdd6;border-radius:8px}
.env .front{background:linear-gradient(135deg,#fde4ea,#f7c6d2);border-radius:8px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env .flap{background:linear-gradient(#fbd5de,#f2b3c3);clip-path:polygon(0 0,100% 0,50% 60%);transform-origin:top;transition:transform .7s ease;border-radius:8px 8px 0 0}
.env.open .flap{transform:rotateX(180deg)}
.env .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(1.6rem,8vw,2.2rem);color:var(--rose);z-index:2;transition:opacity .4s;animation:beat 1.4s ease-in-out infinite}
.env.open .seal{opacity:0}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.18)}}

/* Carta */
.letter-wrap{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px));
  background:rgba(60,15,30,.35);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.letter-wrap.on{opacity:1;visibility:visible}
.letter{position:relative;width:min(100%,460px);max-height:100%;overflow:auto;background:var(--paper);color:#4a2a33;border-radius:6px;padding:2rem 1.6rem 1.6rem;
  box-shadow:0 20px 50px rgba(0,0,0,.35);transform:translateY(40px) scale(.96);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.letter-wrap.on .letter{transform:none}
.letter h2{font-family:var(--script);font-weight:400;font-size:2.1rem;color:#8c2742;margin:0 0 1rem;text-align:center}
.letter p{font-size:1.18rem;line-height:1.55;margin:0 0 .9rem}
.sign{font-family:var(--script);font-size:1.9rem!important;color:#8c2742;text-align:right;margin-top:1.2rem!important}
.x{position:absolute;top:.6rem;right:.7rem;width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid #d7b9c0;background:none;color:#8c2742;font-size:1.1rem;cursor:pointer}
.again{display:block;margin:.4rem auto 0;border:0;background:none;color:#8c2742;font:italic 1rem var(--serif);text-decoration:underline;cursor:pointer;opacity:0;transition:opacity .8s}
.again.show{opacity:1}
button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* ===== Animaciones extra ===== */
.scene{z-index:1;transform:scale(.96);filter:blur(6px);transition:opacity .9s ease,visibility .9s,transform .9s ease,filter .9s ease}
.scene.on{transform:none;filter:none}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;bottom:-40px;font-style:normal;color:var(--rose);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.35}100%{transform:translateY(-110vh) translateX(var(--dx)) rotate(var(--rot)) scale(1.1);opacity:0}}
.fp.ok{animation:ok .7s ease-out}
@keyframes ok{0%{box-shadow:0 0 0 0 var(--rose)}100%{box-shadow:0 0 0 46px transparent}}
.ch{display:inline-block}
.gift.on .ch{animation:drop .9s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*75ms + .3s)}
@keyframes drop{from{opacity:0;transform:translateY(-34px) rotate(-8deg) scale(.7);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.gift.on .date,.gift.on .hint{animation:fadeUp 1s 1.6s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:.75;transform:none}}
.gift.on .env{animation:envIn 1.1s .6s cubic-bezier(.2,.9,.3,1.2) both,float 3.2s 1.8s ease-in-out infinite}
@keyframes envIn{from{opacity:0;transform:translateY(40px) scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
.env .paper{position:absolute;left:8%;right:8%;top:6%;height:84%;background:var(--paper);border-radius:4px;z-index:1;transition:transform .9s cubic-bezier(.3,.9,.3,1) .25s;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.env .front{z-index:2}
.env .flap{z-index:3;transition:transform .7s ease,z-index 0s .35s}
.env.open .flap{z-index:0}
.env.open .paper{transform:translateY(-58%)}
.env .seal{z-index:4}
.h{position:absolute;left:50%;top:40%;color:var(--rose);pointer-events:none;z-index:5;animation:pop 1.2s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(var(--r));opacity:0}}
.letter{transform:perspective(900px) translateY(60px) rotateX(-14deg) scale(.94);transform-origin:top}
.w{display:inline-block;animation:wordIn .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes wordIn{from{opacity:0;filter:blur(6px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
.sign .txt{display:inline-block;white-space:pre-line;animation:wipe 2s ease-out both;animation-delay:var(--d)}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.sign .hrt{display:inline-block;animation:heartIn .8s cubic-bezier(.2,1.6,.4,1) both var(--d2),beat2 1.3s ease-in-out infinite calc(var(--d2) + .8s)}
@keyframes heartIn{from{opacity:0;transform:scale(0) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes beat2{50%{transform:scale(1.3)}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="bg" id="bg" aria-hidden="true"></div>

<section class="scene lock on" id="lock">
  <h1 id="lockTitle"></h1>
  <button class="fp" id="fp" aria-label="Mantén presionado para desbloquear">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring" id="ring" cx="50" cy="50" r="46"/>
      <g class="prints">
        <path d="M30 42a22 22 0 0 1 40 0"/><path d="M26 54a26 26 0 0 1 4-12"/><path d="M34 50a16 16 0 0 1 32 0v8"/>
        <path d="M42 50a8 8 0 0 1 16 0v14c0 4 1 8 3 11"/><path d="M50 50v16c0 5 2 9 4 12"/><path d="M34 60c0 8 2 14 6 20"/>
        <path d="M26 60c0 10 3 17 8 24"/><path d="M66 58c0 8 2 14 5 18"/><path d="M74 54c0 8 1 13 3 17"/>
      </g>
    </svg>
    <span class="scan"></span>
  </button>
  <p class="hint" id="lockHint">Mantén presionado la huella</p>
</section>

<section class="scene gift" id="gift">
  <h1 id="giftTitle"></h1>
  <p class="date" id="giftDate"></p>
  <button class="env" id="env" aria-label="Abrir el sobre">
    <span class="back"></span><span class="paper"></span><span class="front"></span><span class="flap"></span><span class="seal">❤</span>
  </button>
  <p class="hint">Toca el sobre para abrir la sorpresa</p>
</section>

<div class="letter-wrap" id="letterWrap" role="dialog" aria-modal="true" aria-labelledby="greet">
  <article class="letter" id="letter">
    <button class="x" id="close" aria-label="Cerrar carta">✕</button>
    <h2 id="greet"></h2>
    <div id="body"></div>
    <button class="again" id="again">Volver a leer</button>
  </article>
</div>

<script>
/* ====== EDITA AQUÍ ====== */
const CONFIG = {
  lockTitle: "Feliz aniversario amorcito 😘🥰",
  title: "Feliz Aniversario",
  date: "7 meses · Te amo mi vida ♥",
  greeting: "Mi Amor M.D.G.B.,",
  paragraphs: [
    "Si estás leyendo esto, es porque ya van 7 meses de ti y de mí, siete meses en los que mi corazón aprendió a latir con tu nombre. Desde el primer día llegaste a mi vida con tanta ternura, que sin darme cuenta te convertiste en mi lugar favorito.",
    "Gracias por tus abrazos que calman hasta mis días más grises, por tus besos que me hacen sentir en casa, por tu sonrisa que ilumina todo a su paso y por mirarme con tanto cariño. Contigo descubrí que el amor bonito existe, y que se siente tranquilo, dulce y seguro.",
    "Siete meses y mi corazón ya sabe que quiere mil más. Quiero tus buenos días, tus buenas noches, tu mano entrelazada con la mía y todos esos momentos pequeños que a tu lado se vuelven los más hermosos de mi vida.",
    "Te amo, M.D.G.B., mi vida. Hoy, mañana y en cada aniversario que el destino nos regale."
  ],
  sign: "Siempre tuyo,\ncon mucho amor, tu niño chiquito",
  holdMs: 1400
};
/* ======================== */

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
$("lockTitle").textContent = CONFIG.lockTitle;
[...CONFIG.title].forEach((c, i) => { const sp = document.createElement("span"); sp.className = "ch";
  sp.textContent = c === " " ? "\u00a0" : c; sp.style.setProperty("--i", i); $("giftTitle").appendChild(sp); });
const bg = $("bg");
for (let k = 0; k < 14; k++) { const h = document.createElement("i"); h.textContent = "❤";
  h.style.cssText = `left:${Math.random()*100}%;font-size:${10+Math.random()*16}px;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*14}s;--dx:${-40+Math.random()*80}px;--rot:${-40+Math.random()*80}deg`;
  bg.appendChild(h); }
$("giftDate").textContent = CONFIG.date;
$("greet").textContent = CONFIG.greeting;

/* ---------- Huella: mantener presionado ---------- */
const fp = $("fp"), ring = $("ring"), hint = $("lockHint");
let t0 = 0, raf = 0, done = false;
function step(now){
  const p = Math.min((now - t0) / CONFIG.holdMs, 1);
  ring.style.strokeDashoffset = 289 * (1 - p);
  if (p > .6) hint.textContent = "Casi listo…";
  if (p >= 1) return unlock();
  raf = requestAnimationFrame(step);
}
function startHold(e){
  if (done) return; e.preventDefault();
  fp.classList.add("hold"); hint.textContent = "Escaneando…";
  t0 = performance.now(); raf = requestAnimationFrame(step);
}
function stopHold(){
  if (done) return;
  cancelAnimationFrame(raf); fp.classList.remove("hold");
  ring.style.strokeDashoffset = 289; hint.textContent = "Mantén presionado la huella";
}
function unlock(){
  done = true; cancelAnimationFrame(raf); fp.classList.remove("hold"); fp.classList.add("ok"); hint.textContent = "Listo ♥";
  try { navigator.vibrate && navigator.vibrate(60); } catch(e){}
  setTimeout(() => { $("lock").classList.remove("on"); $("gift").classList.add("on"); }, 700);
}
fp.addEventListener("pointerdown", startHold);
["pointerup","pointerleave","pointercancel"].forEach(ev => fp.addEventListener(ev, stopHold));
fp.addEventListener("contextmenu", e => e.preventDefault());
fp.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) startHold(e); });
fp.addEventListener("keyup", e => { if (e.key === "Enter" || e.key === " ") stopHold(); });

/* ---------- Sobre y carta ---------- */
const env = $("env"), wrap = $("letterWrap"), bodyEl = $("body"), again = $("again");
let timers = [];
function renderLetter(){
  timers.forEach(clearTimeout); timers = [];
  again.classList.remove("show"); bodyEl.innerHTML = "";
  let t = reduce ? 0 : .8;
  const follow = (el, at) => { if (!reduce) timers.push(setTimeout(() => el.scrollIntoView({behavior:"smooth", block:"center"}), at * 1000)); };
  CONFIG.paragraphs.forEach(txt => {
    const p = document.createElement("p");
    txt.split(" ").forEach(w => {
      const sp = document.createElement("span"); sp.className = "w"; sp.textContent = w;
      sp.style.setProperty("--d", t.toFixed(2) + "s"); t += .06; p.append(sp, " ");
    });
    bodyEl.appendChild(p); follow(p, Math.max(t - 1.2, 0)); t += .4;
  });
  const sg = document.createElement("p"); sg.className = "sign";
  const tx = document.createElement("span"); tx.className = "txt"; tx.textContent = CONFIG.sign + " ";
  tx.style.setProperty("--d", t.toFixed(2) + "s");
  const hr = document.createElement("span"); hr.className = "hrt"; hr.textContent = "♥";
  hr.style.setProperty("--d2", (t + 1.9).toFixed(2) + "s");
  sg.append(tx, hr); bodyEl.appendChild(sg); follow(sg, t);
  timers.push(setTimeout(() => { again.classList.add("show"); again.scrollIntoView({behavior:"smooth", block:"nearest"}); }, reduce ? 0 : (t + 3) * 1000));
}
function burst(){
  for (let k = 0; k < 18; k++) {
    const h = document.createElement("span"); h.className = "h"; h.textContent = Math.random() < .5 ? "❤" : "✦";
    const a = Math.random() * 6.283, d = 70 + Math.random() * 110;
    h.style.cssText = `--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d - 40}px;--r:${-60+Math.random()*120}deg;font-size:${12+Math.random()*16}px`;
    env.appendChild(h); setTimeout(() => h.remove(), 1300);
  }
}
function openLetter(){
  env.classList.add("open");
  burst(); try { navigator.vibrate && navigator.vibrate([30,40,30]); } catch(e){}
  petals.start();
  setTimeout(() => { wrap.classList.add("on"); renderLetter(); $("close").focus({preventScroll:true}); }, reduce ? 0 : 1500);
}
function closeLetter(){ wrap.classList.remove("on"); env.focus({preventScroll:true}); }
env.addEventListener("click", () => env.classList.contains("open") ? (wrap.classList.add("on"), renderLetter()) : openLetter());
$("close").addEventListener("click", closeLetter);
again.addEventListener("click", renderLetter);
wrap.addEventListener("click", e => { if (e.target === wrap) closeLetter(); });
addEventListener("keydown", e => { if (e.key === "Escape" && wrap.classList.contains("on")) closeLetter(); });

/* ---------- Pétalos (canvas) ---------- */
const petals = (() => {
  const cv = $("petals"), ctx = cv.getContext("2d");
  const colors = ["#f48fa6","#e75a7c","#f7b6c4","#fbd0da","#d94f6e"];
  let W, H, list = [], running = false, dpr = 1;
  function size(){ dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  const make = (top) => ({
    x: Math.random() * W, y: top ? -20 : Math.random() * -H, s: 6 + Math.random() * 8,
    vy: .6 + Math.random() * 1.2, vx: -.4 + Math.random() * .8, r: Math.random() * 6.28,
    vr: -.03 + Math.random() * .06, sw: Math.random() * 6.28, h: Math.random() < .3, c: colors[(Math.random() * colors.length) | 0]
  });
  function draw(){
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of list){
      p.sw += .02; p.x += p.vx + Math.sin(p.sw) * .6; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 20) Object.assign(p, make(true));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = .85; ctx.fillStyle = p.c;
      if (p.h) { ctx.scale(p.s / 8, p.s / 8); ctx.beginPath(); ctx.moveTo(0, 4); ctx.bezierCurveTo(-9, -2, -4, -8, 0, -3); ctx.bezierCurveTo(4, -8, 9, -2, 0, 4); ctx.fill(); }
      else { ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, 6.283); ctx.fill(); }
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  addEventListener("resize", size);
  return { start(){
    if (running || reduce) return; size();
    list = Array.from({length: innerWidth < 600 ? 35 : 60}, () => make(false));
    running = true; draw();
  } };
})();
</script>
</body>
</html>
